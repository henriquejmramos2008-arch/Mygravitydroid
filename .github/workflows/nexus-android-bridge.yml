name: Nexus Android Bridge APK
on:
  push:
    branches: [nexus-android-bridge-build]
    paths:
      - 'nexus-android-bridge/**'
      - '.github/workflows/nexus-android-bridge.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: nexus-android-bridge
        run: gradle :android:app:assembleDebug --no-daemon
      - name: Check APK
        run: |
          test -s nexus-android-bridge/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum nexus-android-bridge/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-Android-Bridge-0.1-debug-apk
          path: nexus-android-bridge/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
